<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dodge Box</title>
<style>
  html,body{margin:0;height:100%;background:#11140f;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d');
const W = 320, H = 180;
const keys = {};
let p, blocks, t, best = 0, state = 'title', spawn, touchX = null;

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  if ((k === ' ' || k === 'enter') && state !== 'play') reset();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function pos(e) {
  const r = cv.getBoundingClientRect();
  const s = Math.min(r.width / W, r.height / H);
  const off = (r.width - W * s) / 2;
  return (e.clientX - r.left - off) / s;
}
cv.addEventListener('pointerdown', e => { if (state !== 'play') { reset(); return; } touchX = pos(e); });
cv.addEventListener('pointermove', e => { if (touchX !== null) touchX = pos(e); });
addEventListener('pointerup', () => touchX = null);

function reset() { p = { x: W/2 - 5, y: H - 18, w: 10, h: 10 }; blocks = []; t = 0; spawn = 0; state = 'play'; }

function step(dt) {
  t += dt;
  let dx = (keys.arrowleft || keys.a ? -1 : 0) + (keys.arrowright || keys.d ? 1 : 0);
  if (touchX !== null) dx = Math.max(-1, Math.min(1, (touchX - (p.x + p.w/2)) / 8));
  p.x = Math.max(0, Math.min(W - p.w, p.x + dx * 110 * dt));

  spawn -= dt;
  if (spawn <= 0) {
    spawn = Math.max(0.18, 0.7 - t * 0.02);
    const w = 6 + Math.random() * 14;
    blocks.push({ x: Math.random() * (W - w), y: -12, w, h: 6 + Math.random() * 6, v: 50 + Math.random() * 40 + t * 3 });
  }
  for (const b of blocks) {
    b.y += b.v * dt;
    if (b.x < p.x + p.w && b.x + b.w > p.x && b.y < p.y + p.h && b.y + b.h > p.y) { state = 'over'; best = Math.max(best, t); }
  }
  blocks = blocks.filter(b => b.y < H + 20);
}

function text(s, x0, y0, c, size = 8, align = 'center') {
  x.fillStyle = c; x.font = `bold ${size}px monospace`; x.textAlign = align; x.fillText(s, x0, y0);
}

function draw() {
  x.fillStyle = '#11140f'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#1d2418';
  for (let i = 0; i < W; i += 16) x.fillRect(i, 0, 1, H);
  for (let j = 0; j < H; j += 16) x.fillRect(0, j, W, 1);
  x.fillStyle = '#ffd84a';
  for (const b of blocks) x.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h));
  x.fillStyle = '#b6e33b'; x.fillRect(Math.round(p.x), Math.round(p.y), p.w, p.h);
  x.fillStyle = '#2a3322'; x.fillRect(0, H - 8, W, 8);
  text('TIME ' + t.toFixed(1), 6, 12, '#e6efd3', 8, 'left');
  text('BEST ' + best.toFixed(1), W - 6, 12, '#e6efd3', 8, 'right');
  if (state === 'title') {
    text('DODGE BOX', W/2, H/2 - 10, '#b6e33b', 16);
    text('ARROWS / A D  ·  DRAG ON TOUCH', W/2, H/2 + 8, '#e6efd3');
    text('PRESS SPACE OR TAP', W/2, H/2 + 22, '#ffd84a');
  }
  if (state === 'over') {
    text('BONK.', W/2, H/2 - 10, '#ffd84a', 16);
    text('YOU LASTED ' + t.toFixed(1) + 's', W/2, H/2 + 8, '#e6efd3');
    text('SPACE OR TAP TO RETRY', W/2, H/2 + 22, '#b6e33b');
  }
}

p = { x: W/2 - 5, y: H - 18, w: 10, h: 10 }; blocks = []; t = 0;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
